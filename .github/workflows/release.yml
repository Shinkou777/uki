name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: bash scripts/build-app.sh

      - name: Package DMG
        run: |
          mkdir -p dist
          hdiutil create -volname ClaudeFloater \
            -srcfolder /Applications/ClaudeFloater.app \
            -ov -format UDZO dist/ClaudeFloater.dmg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClaudeFloater.dmg
          draft: false
          prerelease: false

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeFloater-DMG
          path: dist/ClaudeFloater.dmg
