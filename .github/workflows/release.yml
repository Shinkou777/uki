name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The default Xcode ships an older Swift whose type-checker times out on
      # the large SwiftUI bodies ("unable to type-check this expression in
      # reasonable time"). Pin to the newest stable Xcode (Swift 6.x), which
      # type-checks the file fine — matching the local build.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build app
        run: bash scripts/build-app.sh

      - name: Package DMG
        run: |
          mkdir -p dist
          hdiutil create -volname Uki \
            -srcfolder /Applications/Uki.app \
            -ov -format UDZO dist/Uki.dmg

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Uki.dmg
          draft: false
          prerelease: false

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Uki-DMG
          path: dist/Uki.dmg
